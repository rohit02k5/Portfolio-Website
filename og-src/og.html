<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #050914;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
      }
      .b1 {
        width: 700px;
        height: 700px;
        top: -280px;
        left: -180px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.55), transparent 65%);
      }
      .b2 {
        width: 560px;
        height: 560px;
        top: -120px;
        right: -160px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.4), transparent 65%);
      }
      .b3 {
        width: 500px;
        height: 500px;
        bottom: -280px;
        left: 38%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.34), transparent 65%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 178, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 178, 255, 0.07) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(
          ellipse 85% 75% at 50% 40%,
          black 15%,
          transparent 70%
        );
        mask-image: radial-gradient(
          ellipse 85% 75% at 50% 40%,
          black 15%,
          transparent 70%
        );
      }
      .inner {
        position: relative;
        text-align: center;
        padding: 0 80px;
      }
      .mono {
        font-family: "Consolas", "Courier New", monospace;
      }
      .eyebrow {
        color: #38bdf8;
        letter-spacing: 0.4em;
        font-size: 15px;
        text-transform: uppercase;
      }
      h1 {
        color: #e9f0fd;
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-top: 22px;
        line-height: 1;
      }
      h1 .grad {
        background: linear-gradient(100deg, #38bdf8, #4f7fff, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        color: #9db2d1;
        font-size: 27px;
        margin-top: 22px;
        font-weight: 500;
      }
      .chips {
        margin-top: 38px;
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .chip {
        font-family: "Consolas", monospace;
        font-size: 15px;
        color: #9db2d1;
        border: 1px solid rgba(148, 178, 255, 0.25);
        border-radius: 999px;
        padding: 9px 20px;
        background: rgba(56, 189, 248, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grid"></div>
    <div class="inner">
      <p class="mono eyebrow">IIT Bhilai · Class of 2027</p>
      <h1>Sai <span class="grad">Rohit</span></h1>
      <p class="sub">AI/ML &amp; Full-Stack Engineer — real-time systems that ship</p>
      <div class="chips">
        <span class="chip">CGPA 8.86</span>
        <span class="chip">Amazon ML Summer School '26</span>
        <span class="chip">Springer Nature — VETOMAC</span>
        <span class="chip">4 internships</span>
      </div>
    </div>
  </body>
</html>
